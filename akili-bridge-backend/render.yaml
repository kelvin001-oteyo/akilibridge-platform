services:
  - type: web
    name: akili-bridge-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://your-frontend-url.vercel.app
      - key: ADMIN_EMAIL
        value: admin@akilibridge.org
      - key: ADMIN_PASSWORD
        value: admin123